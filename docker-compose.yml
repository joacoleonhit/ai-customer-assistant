services:
  db:
    image: postgres:16

    container_name: ai_assistant_db

    
    ##variables de PostgreSQL
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: