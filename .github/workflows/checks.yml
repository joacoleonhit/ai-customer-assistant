name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://test:ci-only-password@localhost:5432/assistant_test
      JWT_SECRET: ci-only-signing-key-never-use-in-production
      CONVERSATION_AI_PROVIDER: simulated
      DEMO_AI_PROVIDER: simulated
      ENABLE_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Migrate an empty database
        working-directory: backend
        run: python -m alembic upgrade head
      - run: python backend/scripts/check_conversation_guards.py
      - run: python backend/scripts/check_chat_alerts.py
      - run: python backend/scripts/check_portfolio_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/public/panel.js
