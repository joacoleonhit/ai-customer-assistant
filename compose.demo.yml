name: assistant-portfolio-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assistant_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run python start_demo.py first}
    volumes:
      - demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d assistant_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://demo:${DEMO_DB_PASSWORD}@db:5432/assistant_demo
      JWT_SECRET: ${DEMO_JWT_SECRET:?Run python start_demo.py first}
      ENABLE_DEMO: "true"
      DEMO_ONLY: "true"
      DEMO_AI_PROVIDER: ${DEMO_AI_PROVIDER:-simulated}
      CONVERSATION_AI_PROVIDER: simulated
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CONVERSATION_MODEL: ${OLLAMA_CONVERSATION_MODEL:-qwen3:14b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CONVERSATION_MODEL: ${OPENAI_CONVERSATION_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/demo/config')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
volumes:
  demo_data:
